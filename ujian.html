<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruang Ujian Online</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="exam-mode">
  <!-- TOPBAR UJIAN -->
  <header class="exam-header">
    <div class="exam-header-left">
      <h3 id="header-exam-title">Memuat Ujian...</h3>
      <span id="header-student-info" class="text-muted">Memuat Identitas...</span>
    </div>
    <div class="exam-header-right">
      <div id="timer-display" class="timer-box">⏱️ 00:00:00</div>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-toggle-grid">Daftar Soal</button>
    </div>
  </header>

  <!-- KONTEN UTAMA SOAL -->
  <main class="exam-container">
    <!-- WACANA STIMULUS (JIKA ADA) -->
    <section id="stimulus-block-container" class="card d-none" style="margin-bottom: 20px; border-left: 4px solid var(--primary-color);">
      <h4 id="stimulus-title" style="color: var(--primary-color); margin-top: 0;">Wacana Stimulus</h4>
      <div id="stimulus-image-wrap" style="display:none; text-align:center; margin: 10px 0;">
        <img id="stimulus-image" src="" alt="Gambar Stimulus" style="max-width: 100%; max-height: 360px; border-radius: 6px;">
      </div>
      <div id="stimulus-content" style="white-space: pre-line; line-height: 1.7; font-size: 1rem;"></div>
    </section>

    <!-- KARTU SOAL AKTIF -->
    <section class="card exam-question-card">
      <div class="question-header">
        <div>
          <span id="display-q-number" style="font-weight: 800; font-size: 1.1rem; color: var(--primary-color);">Soal No. 1</span>
          <span id="display-q-type" class="badge badge-secondary" style="margin-left: 8px;">Pilihan Ganda</span>
          <span id="display-q-points" class="text-muted" style="font-size: 0.85rem; margin-left: 6px;">(Poin)</span>
        </div>
        <div>
          <label style="font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;">
            <input type="checkbox" id="check-doubt"> 🟡 Ragu-Ragu
          </label>
        </div>
      </div>

      <div id="display-q-image-wrap" style="display:none; text-align:center; margin: 15px 0;">
        <img id="display-q-image" src="" alt="Gambar Soal" style="max-width: 100%; max-height: 380px; border-radius: 6px;">
      </div>

      <div id="display-q-content" style="white-space: pre-line; margin: 15px 0 20px 0; font-size: 1.05rem; line-height: 1.7;">
        Memuat pertanyaan...
      </div>

      <!-- PILIHAN JAWABAN (A, B, C, D, E, F) -->
      <div id="display-options-list" class="options-group"></div>

      <!-- NAVIGASI BAWAH -->
      <div class="exam-footer-nav" style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 15px; border-top: 1px solid var(--border-color);">
        <button type="button" class="btn btn-secondary" id="btn-prev-question">&larr; Soal Sebelumnya</button>
        <button type="button" class="btn btn-primary" id="btn-next-question">Soal Berikutnya &rarr;</button>
        <button type="button" class="btn btn-success d-none" id="btn-finish-exam" style="background-color: #059669; font-weight: 700;">🚀 Kumpulkan Ujian</button>
      </div>
    </section>
  </main>

  <!-- DRAWER DAFTAR NOMOR SOAL -->
  <div id="drawer-grid" class="modal-overlay d-none">
    <div class="modal-content" style="max-width: 480px;">
      <div class="card-header" style="margin-bottom: 15px;">
        <span class="card-title">Navigasi Nomor Soal</span>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-close-grid">X</button>
      </div>
      <div style="display: flex; gap: 12px; margin-bottom: 12px; font-size: 0.8rem;">
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 12px; height: 12px; background: #059669; display: inline-block; border-radius: 2px;"></span> Terjawab</span>
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 12px; height: 12px; background: #eab308; display: inline-block; border-radius: 2px;"></span> Ragu-Ragu</span>
        <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 12px; height: 12px; background: #e2e8f0; display: inline-block; border-radius: 2px;"></span> Belum</span>
      </div>
      <div id="grid-numbers-container" class="grid-numbers-wrapper" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 320px; overflow-y: auto; padding: 4px;"></div>
    </div>
  </div>

  <!-- ELEMEN GLOBAL LOADING OVERLAY & SPINNER -->
  <div id="global-loader" class="loading-overlay d-none">
    <div class="spinner"></div>
    <div class="loading-text" id="loader-message">Mengirim Jawaban Ujian...</div>
    <div class="loading-subtext">Mohon tunggu, sistem sedang memverifikasi dan menghitung skor Anda.</div>
  </div>

  <!-- SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/siswa-auth.js"></script>
  <script src="js/ujian.js"></script>
</body>
</html>
