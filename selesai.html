<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian Selesai</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      height: 100%;
      min-height: 100vh;
      overflow-y: auto !important;
      background-color: #f1f5f9;
    }

    .finish-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    .finish-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .success-icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      color: var(--success-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px auto;
    }

    .score-badge {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-color);
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div class="finish-wrapper">
    <div class="finish-card">
      <div class="success-icon">✓</div>
      
      <h2 style="color: var(--text-main); font-size: 1.35rem; font-weight: 800; margin-bottom: 6px;">Ujian Berhasil Dikumpulkan!</h2>
      <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 20px;">Seluruh jawaban Anda telah tersimpan dengan aman di server.</p>

      <!-- RINGKASAN HASIL -->
      <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 20px; text-align: left;">
        <table style="width: 100%; font-size: 0.9rem; border-collapse: collapse;">
          <tr>
            <td style="padding: 4px 0; color: var(--text-muted); width: 45%;">Nama Peserta</td>
            <td style="padding: 4px 0; font-weight: 700;" id="res-student-name">-</td>
          </tr>
          <tr>
            <td style="padding: 4px 0; color: var(--text-muted);">NIS / NISN</td>
            <td style="padding: 4px 0; font-weight: 600;" id="res-student-nisn">-</td>
          </tr>
          <tr>
            <td style="padding: 4px 0; color: var(--text-muted);">Mata Pelajaran</td>
            <td style="padding: 4px 0; font-weight: 600;" id="res-exam-subject">-</td>
          </tr>
          <tr>
            <td style="padding: 4px 0; color: var(--text-muted);">Waktu Selesai</td>
            <td style="padding: 4px 0; font-weight: 600;" id="res-submitted-time">-</td>
          </tr>
          <tr>
            <td style="padding: 4px 0; color: var(--text-muted);">Soal Dijawab Benar</td>
            <td style="padding: 4px 0; font-weight: 700; color: var(--success-color);" id="res-correct-count">-</td>
          </tr>
        </table>
      </div>

      <!-- KARTU SKOR NILAI -->
      <div style="background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 14px; margin-bottom: 24px;">
        <small style="font-weight: 700; color: #4338ca; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px;">Nilai Akhir Anda</small>
        <div class="score-badge" id="res-final-score">0</div>
        <small class="text-muted" style="font-size: 0.8rem;">Skala Nilai 0 - 100</small>
      </div>

      <button type="button" class="btn btn-primary btn-block" id="btn-back-home" style="padding: 12px; font-size: 0.95rem;">
        Selesai & Keluar &rarr;
      </button>
    </div>
  </div>

  <script src="js/siswa-auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const rawResult = sessionStorage.getItem("exam_finish_result");

      if (!rawResult) {
        window.location.href = "index.html";
        return;
      }

      const res = JSON.parse(rawResult);

      document.getElementById("res-student-name").innerText = res.student_name || "-";
      document.getElementById("res-student-nisn").innerText = res.student_number || "-";
      document.getElementById("res-exam-subject").innerText = `${res.subject || '-'} (${res.exam_title || ''})`;
      document.getElementById("res-submitted-time").innerText = res.submitted_at || "-";
      document.getElementById("res-correct-count").innerText = `${res.correct_count} dari ${res.total_questions} Soal`;
      document.getElementById("res-final-score").innerText = res.final_score;

      document.getElementById("btn-back-home").addEventListener("click", () => {
        sessionStorage.removeItem("exam_finish_result");
        StudentAuthModule.clearSession();
      });
    });
  </script>
</body>
</html>
